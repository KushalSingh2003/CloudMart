name: Deploy Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'infrastructure/**'
      - '.github/workflows/infrastructure.yaml'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  STACK_NAME: cloudmart-network-stack
  TEMPLATE_FILE: infrastructure/network-stack.yaml

jobs:
  deploy-network:
    name: Deploy Network Stack
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check if stack exists
        id: stack-check
        run: |
          if aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Change Set
        run: |
          if [ "${{ steps.stack-check.outputs.exists }}" = "true" ]; then
            CHANGE_SET_TYPE="UPDATE"
          else
            CHANGE_SET_TYPE="CREATE"
          fi

          CHANGE_SET_NAME="cloudmart-${GITHUB_RUN_ID}"

          aws cloudformation create-change-set \
            --stack-name "$STACK_NAME" \
            --template-body file://"$TEMPLATE_FILE" \
            --change-set-name "$CHANGE_SET_NAME" \
            --change-set-type "$CHANGE_SET_TYPE" \
            --region "$AWS_REGION"

          echo "CHANGE_SET_NAME=$CHANGE_SET_NAME" >> "$GITHUB_ENV"

      - name: Wait for Change Set
        run: |
          aws cloudformation wait change-set-create-complete \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" \
            --region "$AWS_REGION"

      - name: Display Change Set
        run: |
          aws cloudformation describe-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" \
            --region "$AWS_REGION"

      - name: Execute Change Set
        run: |
          aws cloudformation execute-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET_NAME" \
            --region "$AWS_REGION"

      - name: Wait for Stack
        run: |
          if [ "${{ steps.stack-check.outputs.exists }}" = "true" ]; then
            aws cloudformation wait stack-update-complete \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"
          else
            aws cloudformation wait stack-create-complete \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"
          fi

      - name: Show Stack Outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs'
