AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart Application Stack

# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
    - dev
    - prod

  LambdaCodeBucket:
    Type: String
    Description: S3 bucket containing Lambda deployment packages
  AuthToken:
    Type: String
    NoEcho: true
  GitHubRunId:
    Description: GitHub Actions run ID for versioned Lambda artifact deployment
    Type: String

# ============================================================
# RESOURCES
# ============================================================

Resources:

  # ==========================================================
  # EVENTBRIDGE EVENT BUS
  # ==========================================================

  CloudMartEventBus:
    Type: AWS::Events::EventBus

    Properties:
      Name: !Sub cloudmart-${Environment}-event-bus

  # ==========================================================
  # IAM ROLE - EC2
  # ==========================================================

  ApplicationEC2Role:
    Type: AWS::IAM::Role

    Properties:
      RoleName: !Sub cloudmart-${Environment}-ec2-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - ec2.amazonaws.com
          Action:
          - sts:AssumeRole

      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

      Tags:
      - Key: Name
        Value: !Sub cloudmart-${Environment}-ec2-role

  # ==========================================================
  # EC2 INSTANCE PROFILE
  # ==========================================================

  ApplicationEC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile

    Properties:
      Roles:
      - !Ref ApplicationEC2Role
  AuthTokenParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cloudmart/${Environment}/auth-token
      Type: String
      Value: !Ref AuthToken
      Description: CloudMart API authentication token
  # ==========================================================
  # EC2 INSTANCE
  # ==========================================================

  ApplicationEC2:
    Type: AWS::EC2::Instance

    Properties:

      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'

      InstanceType: t3.micro

      NetworkInterfaces:
      - DeviceIndex: '0'
        AssociatePublicIpAddress: true
        SubnetId:
          Fn::ImportValue: !Sub cloudmart-${Environment}-PublicSubnetId
        GroupSet:
        - Fn::ImportValue: !Sub cloudmart-${Environment}-EC2SecurityGroupId

      IamInstanceProfile: !Ref ApplicationEC2InstanceProfile

      Tags:
      - Key: Name
        Value: !Sub cloudmart-${Environment}-application-ec2

  # ==========================================================
  # ORDER LAMBDA IAM ROLE
  # ==========================================================

  OrderLambdaRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName: !Sub cloudmart-${Environment}-order-lambda-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole

      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

      Policies:

      - PolicyName: ReadDBCredentials
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - ssm:GetParameter
            Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db-password

      - PolicyName: PublishEvents
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - events:PutEvents
            Resource: !GetAtt CloudMartEventBus.Arn

      Tags:
      - Key: Name
        Value: !Sub cloudmart-${Environment}-order-lambda-role

  # ==========================================================
  # PRODUCT LAMBDA IAM ROLE
  # ==========================================================

  ProductLambdaRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName: !Sub cloudmart-${Environment}-product-lambda-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole

      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

      Policies:

      - PolicyName: ReadDBCredentials
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - ssm:GetParameter
            Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db-password

      - PolicyName: PublishEvents
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - events:PutEvents
            Resource: !GetAtt CloudMartEventBus.Arn

      Tags:
      - Key: Name
        Value: !Sub cloudmart-${Environment}-product-lambda-role

  # ==========================================================
  # CHECK STOCK LAMBDA IAM ROLE
  # ==========================================================

  CheckStockLambdaRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName: !Sub cloudmart-${Environment}-check-stock-lambda-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole

      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:

      - PolicyName: ReadDBCredentials
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - ssm:GetParameter
            Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/*

      - PolicyName: PublishEvents
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - events:PutEvents
            Resource: !GetAtt CloudMartEventBus.Arn

      Tags:
      - Key: Name
        Value: !Sub cloudmart-${Environment}-check-stock-lambda-role

  # ==========================================================
  # REPORT LAMBDA IAM ROLE
  # ==========================================================

  ReportLambdaRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName: !Sub cloudmart-${Environment}-report-lambda-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole

      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:

      - PolicyName: ReadDBCredentials
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - ssm:GetParameter
            Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/*

      Tags:
      - Key: Name
        Value: !Sub cloudmart-${Environment}-report-lambda-role

  # ==========================================================
  # ORDER LAMBDA
  # ==========================================================

  OrderLambda:
    Type: AWS::Lambda::Function

    Properties:
      FunctionName: !Sub cloudmart-${Environment}-order-lambda

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role: !GetAtt OrderLambdaRole.Arn

      Timeout: 30

      MemorySize: 256

      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Sub lambdas/order-${GitHubRunId}.zip
      VpcConfig:
        SubnetIds:
        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-PrivateSubnetAId
        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-PrivateSubnetBId

        SecurityGroupIds:
        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

      Environment:
        Variables:
          DB_HOST:
            Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-rds-endpoint

          DB_PORT:
            Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-rds-port

          DB_NAME:
            Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-database-name

          DB_USER:
            Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-db-master-username

          DB_PASSWORD_PARAMETER: !Sub /cloudmart/${Environment}/db-password
          EVENT_BUS_NAME: !Ref CloudMartEventBus

  # ==========================================================
  # PRODUCT LAMBDA
  # ==========================================================

  ProductLambda:
    Type: AWS::Lambda::Function

    Properties:
      FunctionName: !Sub cloudmart-${Environment}-product-lambda
      Description: CloudMart Product Lambda - soft delete migration again

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role: !GetAtt ProductLambdaRole.Arn

      Timeout: 30

      MemorySize: 256

      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Sub lambdas/product-${GitHubRunId}.zip

      VpcConfig:
        SubnetIds:
        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-PrivateSubnetAId
        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-PrivateSubnetBId

        SecurityGroupIds:
        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

      Environment:
        Variables:

          DB_HOST:
            Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-rds-endpoint

          DB_PORT:
            Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-rds-port

          DB_NAME:
            Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-database-name

          DB_USER:
            Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-db-master-username

          DB_PASSWORD_PARAMETER: !Sub /cloudmart/${Environment}/db-password
          EVENT_BUS_NAME: !Ref CloudMartEventBus

  # ==========================================================
  # CHECK STOCK LAMBDA
  # ==========================================================

  CheckStockLambda:
    Type: AWS::Lambda::Function

    Properties:
      FunctionName: !Sub cloudmart-${Environment}-check-stock-lambda

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role: !GetAtt CheckStockLambdaRole.Arn

      Timeout: 30

      MemorySize: 256

      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: lambdas/stock_change.zip

  # ==========================================================
  # REPORT LAMBDA
  # ==========================================================

  ReportLambda:
    Type: AWS::Lambda::Function

    Properties:
      FunctionName: !Sub cloudmart-${Environment}-report-lambda

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role: !GetAtt ReportLambdaRole.Arn

      Timeout: 30

      MemorySize: 256

      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: lambdas/report.zip

  # ==========================================================
  # LAMBDA AUTHORIZER ROLE
  # ==========================================================

  LambdaAuthorizerRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName: !Sub cloudmart-${Environment}-authorizer-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole

      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:

      - PolicyName: ReadAuthenticationToken
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - ssm:GetParameter
            Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/auth-token

      Tags:
      - Key: Name
        Value: !Sub cloudmart-${Environment}-authorizer-role

  # ==========================================================
  # LAMBDA AUTHORIZER
  # ==========================================================

  LambdaAuthorizer:
    Type: AWS::Lambda::Function

    Properties:
      FunctionName: !Sub cloudmart-${Environment}-authorizer

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role: !GetAtt LambdaAuthorizerRole.Arn

      Timeout: 10

      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: lambdas/authorizer.zip

      Environment:
        Variables:
          AUTH_TOKEN_PARAMETER: !Sub /cloudmart/${Environment}/auth-token
  AuthorizerLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaAuthorizer
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudMartApi}/*
  CloudMartAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: CloudMartAuthorizer
      RestApiId: !Ref CloudMartApi
      Type: REQUEST
      AuthorizerUri: !Sub
        - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerArn}/invocations
        - AuthorizerArn: !GetAtt LambdaAuthorizer.Arn
      IdentitySource: method.request.header.Authorization

  # ==========================================================
  # API GATEWAY
  # ==========================================================

  CloudMartApi:
    Type: AWS::ApiGateway::RestApi

    Properties:
      Name: !Sub cloudmart-${Environment}-api

      EndpointConfiguration:
        Types:
        - REGIONAL

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
    - ProductsGetMethod
    - ProductsPostMethod
    - ProductsPutMethod
    - ProductsDeleteMethod
    - ProductsGetByIdMethod
    - ProductsPatchMethod
    Properties:
      RestApiId: !Ref CloudMartApi
      StageName: dev
  # ==========================================================
  # API GATEWAY RESOURCES
  # ==========================================================

  OrdersResource:
    Type: AWS::ApiGateway::Resource

    Properties:
      RestApiId: !Ref CloudMartApi
      ParentId: !GetAtt CloudMartApi.RootResourceId
      PathPart: orders

  ProductsResource:
    Type: AWS::ApiGateway::Resource

    Properties:
      RestApiId: !Ref CloudMartApi
      ParentId: !GetAtt CloudMartApi.RootResourceId
      PathPart: products
  ProductsGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductsResource
      HttpMethod: GET

      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
          - ProductLambdaArn: !GetAtt ProductLambda.Arn
  ProductsPostMethod:
    Type: AWS::ApiGateway::Method

    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductsResource
      HttpMethod: POST

      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
          - ProductLambdaArn: !GetAtt ProductLambda.Arn
  ProductIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartApi
      ParentId: !Ref ProductsResource
      PathPart: "{productId}"
  ProductsPutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductIdResource
      HttpMethod: PUT

      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
          - ProductLambdaArn: !GetAtt ProductLambda.Arn

  ProductsDeleteMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductIdResource
      HttpMethod: DELETE

      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
          - ProductLambdaArn: !GetAtt ProductLambda.Arn
  ProductsGetByIdMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
    - CloudMartAuthorizer
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductIdResource
      HttpMethod: GET

      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
          - ProductLambdaArn: !GetAtt ProductLambda.Arn
  ProductsPatchMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
    - CloudMartAuthorizer
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductIdResource
      HttpMethod: PATCH

      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
          - ProductLambdaArn: !GetAtt ProductLambda.Arn

  ProductLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProductLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudMartApi}/*/*/products*

  StockResource:
    Type: AWS::ApiGateway::Resource

    Properties:
      RestApiId: !Ref CloudMartApi
      ParentId: !GetAtt CloudMartApi.RootResourceId
      PathPart: stock

  ReportsResource:
    Type: AWS::ApiGateway::Resource

    Properties:
      RestApiId: !Ref CloudMartApi
      ParentId: !GetAtt CloudMartApi.RootResourceId
      PathPart: reports

  # ==========================================================
  # SNS TOPIC
  # ==========================================================

  CloudMartSNSTopic:
    Type: AWS::SNS::Topic

    Properties:
      TopicName: !Sub cloudmart-${Environment}-notifications

      Tags:
      - Key: Name
        Value: !Sub cloudmart-${Environment}-notifications

  # ==========================================================
  # SNS SUBSCRIPTION
  # ==========================================================

  CloudMartSNSSubscription:
    Type: AWS::SNS::Subscription

    Properties:
      TopicArn: !Ref CloudMartSNSTopic

      Protocol: email

      Endpoint: kushalsingh99807@gmail.com

  # ==========================================================
  # EVENTBRIDGE RULE
  # ==========================================================

  OrderEventRule:
    Type: AWS::Events::Rule

    Properties:
      Name: !Sub cloudmart-${Environment}-order-events

      EventBusName: !Ref CloudMartEventBus

      EventPattern:
        source:
        - cloudmart

        detail-type:
        - OrderEvent

      State: ENABLED

      Targets:
      - Arn: !GetAtt OrderLambda.Arn
        Id: OrderLambdaTarget

  # ==========================================================
  # LAMBDA PERMISSION FOR EVENTBRIDGE
  # ==========================================================

  OrderLambdaEventBridgePermission:
    Type: AWS::Lambda::Permission

    Properties:
      FunctionName: !Ref OrderLambda

      Action: lambda:InvokeFunction

      Principal: events.amazonaws.com

      SourceArn: !GetAtt OrderEventRule.Arn

  # ==========================================================
  # APPLICATION S3 BUCKET
  # ==========================================================

  ApplicationS3Bucket:
    Type: AWS::S3::Bucket

    Properties:
      BucketName: !Sub cloudmart-${Environment}-application-${AWS::AccountId}

      VersioningConfiguration:
        Status: Enabled

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      Tags:
      - Key: Name
        Value: !Sub cloudmart-${Environment}-application-bucket
  LowStockEventRule:
    Type: AWS::Events::Rule

    Properties:
      Name: !Sub cloudmart-${Environment}-low-stock-events

      EventBusName: !Ref CloudMartEventBus

      EventPattern:
        source:
        - cloudmart.inventory

        detail-type:
        - Low Stock Alert

      State: ENABLED

      Targets:
      - Arn: !Ref CloudMartSNSTopic
        Id: LowStockSNSTarget
  LowStockSNSTopicPolicy:
    Type: AWS::SNS::TopicPolicy

    Properties:
      Topics:
      - !Ref CloudMartSNSTopic

      PolicyDocument:
        Version: '2012-10-17'

        Statement:
        - Sid: AllowEventBridgePublish
          Effect: Allow

          Principal:
            Service:
            - events.amazonaws.com

          Action:
          - sns:Publish

          Resource: !Ref CloudMartSNSTopic

# ============================================================
# OUTPUTS
# ============================================================

Outputs:

  EC2InstanceId:
    Description: Application EC2 Instance ID
    Value: !Ref ApplicationEC2

  EC2PublicIp:
    Description: Application EC2 Public IP
    Value: !GetAtt ApplicationEC2.PublicIp

  EC2Role:
    Description: EC2 IAM Role
    Value: !Ref ApplicationEC2Role

  EventBusArn:
    Description: CloudMart EventBridge Event Bus ARN
    Value: !GetAtt CloudMartEventBus.Arn

  ApiGatewayId:
    Description: API Gateway ID
    Value: !Ref CloudMartApi

  ApiGatewayUrl:
    Description: API Gateway URL
    Value: !Sub https://${CloudMartApi}.execute-api.${AWS::Region}.amazonaws.com

  SNSTopicArn:
    Description: SNS Topic ARN
    Value: !Ref CloudMartSNSTopic

  ApplicationBucketName:
    Description: Application S3 Bucket
    Value: !Ref ApplicationS3Bucket
