AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart Application Stack

# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
    - dev
    - prod

  LambdaCodeBucket:
    Type: String
    Description: S3 bucket containing Lambda deployment packages

  GitHubRunId:
    Description: GitHub Actions run ID for versioned Lambda artifact deployment
    Type: String
  MaxOrderItems:
    Type: Number
    Default: 50
    Description: Maximum number of items allowed in an order

# ============================================================
# RESOURCES
# ============================================================

Resources:

  # ==========================================================
  # EVENTBRIDGE EVENT BUS
  # ==========================================================

  CloudMartEventBus:
    Type: AWS::Events::EventBus

    Properties:
      Name: !Sub cloudmart-${Environment}-event-bus
    # ==========================================================
    # ORDER LAMBDA IAM ROLE
    # ==========================================================
  DBInitLambdaRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName: !Sub cloudmart-${Environment}-dbInit-lambda-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole

      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

      Policies:

      - PolicyName: ReadDBCredentials
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - ssm:GetParameter
            Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db-*

      Tags:
      - Key: Name
        Value: !Sub cloudmart-${Environment}-dbInit-lambda-role

  OrderLambdaRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName: !Sub cloudmart-${Environment}-order-lambda-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole

      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

      Policies:

      - PolicyName: ReadDBCredentials
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - ssm:GetParameter
            Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db-*

      - PolicyName: PublishEvents
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - events:PutEvents
            Resource: !GetAtt CloudMartEventBus.Arn
      - PolicyName: CloudWatchBusinessMetrics
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - cloudwatch:PutMetricData
            Resource: "*"
            Condition:
              StringEquals:
                cloudwatch:namespace: "CloudMart/Business"

      Tags:
      - Key: Name
        Value: !Sub cloudmart-${Environment}-order-lambda-role

  # ==========================================================
  # PRODUCT LAMBDA IAM ROLE
  # ==========================================================

  ProductLambdaRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName: !Sub cloudmart-${Environment}-product-lambda-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole

      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

      Policies:

      - PolicyName: ReadDBCredentials
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - ssm:GetParameter
            Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db-*

      - PolicyName: PublishEvents
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - events:PutEvents
            Resource: !GetAtt CloudMartEventBus.Arn
      - PolicyName: CloudWatchBusinessMetrics
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - cloudwatch:PutMetricData
            Resource: "*"
            Condition:
              StringEquals:
                cloudwatch:namespace: "CloudMart/Business"

      Tags:
      - Key: Name
        Value: !Sub cloudmart-${Environment}-product-lambda-role
    # ==========================================================
    # CHECK STOCK LAMBDA IAM ROLE
    # ==========================================================
    # ==========================================================
    # REPORT LAMBDA IAM ROLE
    # ==========================================================
  ReportsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      VersioningConfiguration:
        Status: Enabled

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      Tags:
      - Key: Name
        Value: !Sub cloudmart-${Environment}-reports
    # ==========================================================
    # DAILY REPORT EVENTBRIDGE RULE
    # ==========================================================

  DailyReportSchedule:
    Type: AWS::Events::Rule

    Properties:
      Name: !Sub cloudmart-${Environment}-daily-report

      Description: Trigger Daily Report Lambda every day

      ScheduleExpression: cron(30 3 * * ? *)

      State: ENABLED

      Targets:
      - Arn: !GetAtt ReportLambda.Arn
        Id: DailyReportLambdaTarget
  DailyReportLambdaPermission:
    Type: AWS::Lambda::Permission

    Properties:
      FunctionName: !Ref ReportLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DailyReportSchedule.Arn

  ReportLambdaRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName: !Sub cloudmart-${Environment}-report-lambda-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole

      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

      Policies:

      - PolicyName: ReadDBCredentials
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - ssm:GetParameter
            Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db-*
      - PolicyName: UploadReportsToS3
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - s3:PutObject
            Resource: !Sub ${ReportsBucket.Arn}/reports/*

      Tags:
      - Key: Name
        Value: !Sub cloudmart-${Environment}-report-lambda-role
    # ==========================================================
    # ORDER LAMBDA
    # ==========================================================
  DBInitLambda:
    Type: AWS::Lambda::Function

    Properties:
      FunctionName: !Sub cloudmart-${Environment}-dbInit-lambda

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role: !GetAtt DBInitLambdaRole.Arn

      Timeout: 30

      MemorySize: 256

      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Sub lambdas/dbInit-${GitHubRunId}.zip
      VpcConfig:
        SubnetIds:
        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-PrivateSubnetAId
        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-PrivateSubnetBId

        SecurityGroupIds:
        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId
      Environment:
        Variables:
          DB_HOST_PARAMETER: !Sub /cloudmart/${Environment}/db-endpoint
          DB_PORT_PARAMETER: !Sub /cloudmart/${Environment}/db-port
          DB_NAME_PARAMETER: !Sub /cloudmart/${Environment}/db-name
          DB_USER_PARAMETER: !Sub /cloudmart/${Environment}/db-username
          DB_PASSWORD_PARAMETER: !Sub /cloudmart/${Environment}/db-password

  OrderLambda:
    Type: AWS::Lambda::Function

    Properties:
      FunctionName: !Sub cloudmart-${Environment}-order-lambda

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role: !GetAtt OrderLambdaRole.Arn

      Timeout: 30

      MemorySize: 256

      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Sub lambdas/order-${GitHubRunId}.zip
      VpcConfig:
        SubnetIds:
        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-PrivateSubnetAId
        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-PrivateSubnetBId

        SecurityGroupIds:
        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId
      Environment:
        Variables:
          DB_HOST_PARAMETER: !Sub /cloudmart/${Environment}/db-endpoint
          DB_PORT_PARAMETER: !Sub /cloudmart/${Environment}/db-port
          DB_NAME_PARAMETER: !Sub /cloudmart/${Environment}/db-name
          DB_USER_PARAMETER: !Sub /cloudmart/${Environment}/db-username
          DB_PASSWORD_PARAMETER: !Sub /cloudmart/${Environment}/db-password

          EVENT_BUS_NAME: !Ref CloudMartEventBus
          MAX_ORDER_ITEMS: !Ref MaxOrderItems

  # ==========================================================
  # PRODUCT LAMBDA
  # ==========================================================

  ProductLambda:
    Type: AWS::Lambda::Function

    Properties:
      FunctionName: !Sub cloudmart-${Environment}-product-lambda
      Description: CloudMart Product Lambda - soft delete migration again

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role: !GetAtt ProductLambdaRole.Arn

      Timeout: 30

      MemorySize: 256

      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Sub lambdas/product-${GitHubRunId}.zip

      VpcConfig:
        SubnetIds:
        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-PrivateSubnetAId
        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-PrivateSubnetBId

        SecurityGroupIds:
        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

      Environment:
        Variables:
          DB_HOST_PARAMETER: !Sub /cloudmart/${Environment}/db-endpoint
          DB_PORT_PARAMETER: !Sub /cloudmart/${Environment}/db-port
          DB_NAME_PARAMETER: !Sub /cloudmart/${Environment}/db-name
          DB_USER_PARAMETER: !Sub /cloudmart/${Environment}/db-username
          DB_PASSWORD_PARAMETER: !Sub /cloudmart/${Environment}/db-password
          EVENT_BUS_NAME: !Ref CloudMartEventBus

  # ==========================================================
  # CHECK STOCK LAMBDA
  # ==========================================================



  # ==========================================================
  # REPORT LAMBDA
  # ==========================================================

  ReportLambda:
    Type: AWS::Lambda::Function

    Properties:
      FunctionName: !Sub cloudmart-${Environment}-report-lambda

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role: !GetAtt ReportLambdaRole.Arn

      Timeout: 30

      MemorySize: 256
      VpcConfig:
        SubnetIds:
        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-PrivateSubnetAId
        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-PrivateSubnetBId

        SecurityGroupIds:
        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId
      Environment:
        Variables:
          DB_HOST_PARAMETER: !Sub /cloudmart/${Environment}/db-endpoint
          DB_PORT_PARAMETER: !Sub /cloudmart/${Environment}/db-port
          DB_NAME_PARAMETER: !Sub /cloudmart/${Environment}/db-name
          DB_USER_PARAMETER: !Sub /cloudmart/${Environment}/db-username
          DB_PASSWORD_PARAMETER: !Sub /cloudmart/${Environment}/db-password
          REPORTS_BUCKET_NAME: !Ref ReportsBucket

      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Sub lambdas/report-${GitHubRunId}.zip

  # ==========================================================
  # LAMBDA AUTHORIZER ROLE
  # ==========================================================

  LambdaAuthorizerRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName: !Sub cloudmart-${Environment}-authorizer-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole

      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

      Policies:

      - PolicyName: ReadAuthenticationToken
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - ssm:GetParameter
            Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/auth-token
      - PolicyName: ReadDBCredentials
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - ssm:GetParameter
            Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db-*

      Tags:
      - Key: Name
        Value: !Sub cloudmart-${Environment}-authorizer-role

  # ==========================================================
  # LAMBDA AUTHORIZER
  # ==========================================================

  LambdaAuthorizer:
    Type: AWS::Lambda::Function

    Properties:
      FunctionName: !Sub cloudmart-${Environment}-authorizer

      Runtime: python3.12

      Handler: lambda_function.lambda_handler

      Role: !GetAtt LambdaAuthorizerRole.Arn

      Timeout: 10

      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Sub lambdas/authorizer-${GitHubRunId}.zip
      VpcConfig:
        SubnetIds:
        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-PrivateSubnetAId
        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-PrivateSubnetBId

        SecurityGroupIds:
        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-LambdaSecurityGroupId

      Environment:
        Variables:
          DB_HOST_PARAMETER: !Sub /cloudmart/${Environment}/db-endpoint
          DB_PASSWORD_PARAMETER: !Sub /cloudmart/${Environment}/db-password
          DB_USER_PARAMETER: !Sub /cloudmart/${Environment}/db-username
          DB_NAME_PARAMETER: !Sub /cloudmart/${Environment}/db-name
          DB_PORT_PARAMETER: !Sub /cloudmart/${Environment}/db-port
          AUTH_TOKEN_PARAMETER: !Sub /cloudmart/${Environment}/auth-token
  AuthorizerLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaAuthorizer
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudMartApi}/*
  CloudMartAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: CloudMartAuthorizer
      RestApiId: !Ref CloudMartApi
      Type: REQUEST
      AuthorizerUri: !Sub
        - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerArn}/invocations
        - AuthorizerArn: !GetAtt LambdaAuthorizer.Arn
      IdentitySource: method.request.header.Authorization
      AuthorizerResultTtlInSeconds: 0

  # ==========================================================
  # API GATEWAY
  # ==========================================================

  CloudMartApi:
    Type: AWS::ApiGateway::RestApi

    Properties:
      Name: !Sub cloudmart-${Environment}-api

      EndpointConfiguration:
        Types:
        - REGIONAL

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
    - ProductsGetMethod
    - ProductsPostMethod
    - ProductsPutMethod
    - ProductsDeleteMethod
    - ProductsGetByIdMethod
    - ProductsPatchMethod
    - OrdersGetMethod
    - OrdersPostMethod
    - OrdersGetByIdMethod
    - OrdersDeleteMethod
    - OrderPatchMethod
    - OrderPutMethod

    Properties:
      RestApiId: !Ref CloudMartApi
      StageName: !Ref Environment
  # ==========================================================
  # API GATEWAY RESOURCES
  # ==========================================================

  OrdersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartApi
      ParentId: !GetAtt CloudMartApi.RootResourceId
      PathPart: orders

  OrdersGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref OrdersResource
      HttpMethod: GET

      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
          - OrderLambdaArn: !GetAtt OrderLambda.Arn

  OrdersPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref OrdersResource
      HttpMethod: POST

      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
          - OrderLambdaArn: !GetAtt OrderLambda.Arn

  OrderIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartApi
      ParentId: !Ref OrdersResource
      PathPart: "{orderId}"

  OrdersGetByIdMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref OrderIdResource
      HttpMethod: GET

      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
          - OrderLambdaArn: !GetAtt OrderLambda.Arn
  OrdersDeleteMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref OrderIdResource
      HttpMethod: DELETE

      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
          - OrderLambdaArn: !GetAtt OrderLambda.Arn
  OrderPatchMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref OrderIdResource
      HttpMethod: PATCH

      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
          - OrderLambdaArn: !GetAtt OrderLambda.Arn
  OrderPutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref OrderIdResource
      HttpMethod: PUT

      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
          - OrderLambdaArn: !GetAtt OrderLambda.Arn

  OrderLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref OrderLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudMartApi}/*/*/orders*

  ProductsResource:
    Type: AWS::ApiGateway::Resource

    Properties:
      RestApiId: !Ref CloudMartApi
      ParentId: !GetAtt CloudMartApi.RootResourceId
      PathPart: products
  ProductsGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductsResource
      HttpMethod: GET

      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
          - ProductLambdaArn: !GetAtt ProductLambda.Arn
  ProductsPostMethod:
    Type: AWS::ApiGateway::Method

    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductsResource
      HttpMethod: POST

      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
          - ProductLambdaArn: !GetAtt ProductLambda.Arn
  ProductIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartApi
      ParentId: !Ref ProductsResource
      PathPart: "{productId}"
  ProductsPutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductIdResource
      HttpMethod: PUT

      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
          - ProductLambdaArn: !GetAtt ProductLambda.Arn

  ProductsDeleteMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductIdResource
      HttpMethod: DELETE

      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
          - ProductLambdaArn: !GetAtt ProductLambda.Arn
  ProductsGetByIdMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductIdResource
      HttpMethod: GET

      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
          - ProductLambdaArn: !GetAtt ProductLambda.Arn
  ProductsPatchMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartApi
      ResourceId: !Ref ProductIdResource
      HttpMethod: PATCH

      AuthorizationType: CUSTOM
      AuthorizerId: !Ref CloudMartAuthorizer

      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
          - ProductLambdaArn: !GetAtt ProductLambda.Arn

  ProductLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProductLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudMartApi}/*/*/products*

  StockResource:
    Type: AWS::ApiGateway::Resource

    Properties:
      RestApiId: !Ref CloudMartApi
      ParentId: !GetAtt CloudMartApi.RootResourceId
      PathPart: stock

  ReportsResource:
    Type: AWS::ApiGateway::Resource

    Properties:
      RestApiId: !Ref CloudMartApi
      ParentId: !GetAtt CloudMartApi.RootResourceId
      PathPart: reports

  # ==========================================================
  # SNS TOPIC
  # ==========================================================

  CloudMartSNSTopic:
    Type: AWS::SNS::Topic

    Properties:
      TopicName: !Sub cloudmart-${Environment}-notifications

      Tags:
      - Key: Name
        Value: !Sub cloudmart-${Environment}-notifications
  CloudMartSNSTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
      - !Ref CloudMartSNSTopic

      PolicyDocument:
        Version: "2012-10-17"
        Statement:
        - Sid: AllowCloudWatchAlarms
          Effect: Allow
          Principal:
            Service: cloudwatch.amazonaws.com
          Action: sns:Publish
          Resource: !Ref CloudMartSNSTopic
          Condition:
            StringEquals:
              aws:SourceAccount: !Ref AWS::AccountId
        - Sid: AllowEventBridge
          Effect: Allow
          Principal:
            Service: events.amazonaws.com
          Action: sns:Publish
          Resource: !Ref CloudMartSNSTopic
          Condition:
            StringEquals:
              aws:SourceAccount: !Ref AWS::AccountId
  # ==========================================================
  # SNS SUBSCRIPTION
  # ==========================================================

  CloudMartSNSSubscription:
    Type: AWS::SNS::Subscription

    Properties:
      TopicArn: !Ref CloudMartSNSTopic

      Protocol: email

      Endpoint: motivatedguy101@gmail.com

  # ==========================================================
  # EVENTBRIDGE RULE
  # ==========================================================

  OrderEventRule:
    Type: AWS::Events::Rule

    Properties:

      Name: !Sub cloudmart-${Environment}-order-events

      EventBusName: !Ref CloudMartEventBus

      EventPattern:

        source:
        - cloudmart

        detail-type:
        - OrderCreated
        - OrderFailed
        - OrderStatusChanged
        - OrderConfirmed

      State: ENABLED
      Targets:
      - Arn: !Ref CloudMartSNSTopic
        Id: OrderSNSTarget

        InputTransformer:

          InputPathsMap:
            eventType: "$.detail-type"
            source: "$.source"
            time: "$.time"
            orderId: "$.detail.order_id"
            customerId: "$.detail.customer_id"
            totalAmount: "$.detail.total_amount"
            status: "$.detail.status"
            oldStatus: "$.detail.old_status"
            newStatus: "$.detail.new_status"
            productId: "$.detail.product_id"
            requestedQuantity: "$.detail.requested_quantity"
            availableStock: "$.detail.available_stock"
            reason: "$.detail.reason"

          InputTemplate: |
            "CLOUDMART ORDER NOTIFICATION\n\nEvent Type: <eventType>\nSource: <source>\nTime: <time>\n\nORDER DETAILS\n\nOrder ID: <orderId>\nCustomer ID: <customerId>\nTotal Amount: <totalAmount>\nStatus: <status>\nPrevious Status: <oldStatus>\nNew Status: <newStatus>\n\nADDITIONAL DETAILS\n\nProduct ID: <productId>\nRequested Quantity: <requestedQuantity>\nAvailable Stock: <availableStock>\nReason: <reason>\n\nThis is an automated notification from CloudMart."

  OrderSNSTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
      - !Ref CloudMartSNSTopic

      PolicyDocument:

        Version: '2012-10-17'

        Statement:

        - Sid: AllowEventBridgePublish

          Effect: Allow

          Principal:
            Service:
            - events.amazonaws.com

          Action:
          - sns:Publish

          Resource: !Ref CloudMartSNSTopic
  # ==========================================================
  # LAMBDA PERMISSION FOR EVENTBRIDGE
  # ==========================================================

  OrderLambdaEventBridgePolicy:
    Type: AWS::IAM::Policy

    Properties:

      PolicyName: !Sub cloudmart-${Environment}-order-eventbridge-policy

      Roles:
      - !Ref OrderLambdaRole

      PolicyDocument:

        Version: '2012-10-17'

        Statement:

        - Effect: Allow

          Action:
          - events:PutEvents

          Resource:
          - !GetAtt CloudMartEventBus.Arn

  # ==========================================================
  # APPLICATION S3 BUCKET
  # ==========================================================

  ApplicationS3Bucket:
    Type: AWS::S3::Bucket

    Properties:
      BucketName: !Sub cloudmart-${Environment}-application-${AWS::AccountId}

      VersioningConfiguration:
        Status: Enabled

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      Tags:
      - Key: Name
        Value: !Sub cloudmart-${Environment}-application-bucket
  LowStockEventRule:
    Type: AWS::Events::Rule

    Properties:
      Name: !Sub cloudmart-${Environment}-low-stock-events

      EventBusName: !Ref CloudMartEventBus

      EventPattern:
        source:
        - cloudmart.inventory

        detail-type:
        - Low Stock Alert

      State: ENABLED

      Targets:
      - Arn: !Ref CloudMartSNSTopic
        Id: LowStockSNSTarget

        InputTransformer:
          InputPathsMap:
            productId: "$.detail.ProductID"
            stock: "$.detail.Stock"
            threshold: "$.detail.Threshold"
            time: "$.time"

          InputTemplate: |
            "CLOUDMART LOW STOCK ALERT\n\nAlert Type: LOW STOCK ALERT\nTime: <time>\n\nPRODUCT DETAILS\n\nProduct ID: <productId>\nCurrent Stock: <stock>\nThreshold: <threshold>\n\nStatus: ACTION REQUIRED\n\nPlease review the inventory and restock this product.\n\nThis is an automated notification from CloudMart."

  LowStockSNSTopicPolicy:
    Type: AWS::SNS::TopicPolicy

    Properties:
      Topics:
      - !Ref CloudMartSNSTopic

      PolicyDocument:
        Version: '2012-10-17'

        Statement:
        - Sid: AllowEventBridgePublish
          Effect: Allow

          Principal:
            Service:
            - events.amazonaws.com

          Action:
          - sns:Publish

          Resource: !Ref CloudMartSNSTopic

