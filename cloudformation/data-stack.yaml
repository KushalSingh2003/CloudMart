AWSTemplateFormatVersion: '2010-09-09'

Description: CloudMart Data Stack. Creates the RDS MySQL database using the private subnets and RDS security group created by the Network Stack.

# ============================================================================
# PARAMETERS
# ============================================================================

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
    - dev
    - prod
    Description: Deployment environment.

  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    Description: RDS MySQL instance class.

  AllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    Description: RDS allocated storage in GB.

  DatabaseName:
    Type: String
    Default: cloudmart
    Description: Initial database name.

  MasterUsername:
    Type: String
    Default: admin
    Description: RDS master username.

  MasterUserPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: RDS master user password.

  MultiAZ:
    Type: String
    Default: "false"
    AllowedValues:
    - "true"
    - "false"
    Description: Whether RDS should deploy a standby instance in another AZ.

  BackupRetentionPeriod:
    Type: Number
    Default: 7
    MinValue: 0
    Description: Number of days to retain automated backups.

# ============================================================================
# RESOURCES
# ============================================================================

Resources:

  # ==========================================================================
  # RDS DB SUBNET GROUP
  # ==========================================================================

  CloudMartDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup

    Properties:

      DBSubnetGroupDescription: Private subnet group for CloudMart RDS MySQL.

      SubnetIds:

      - Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-PrivateSubnetAId

      - Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-PrivateSubnetBId

      Tags:

      - Key: Name
        Value: !Sub cloudmart-${Environment}-db-subnet-group

      - Key: Project
        Value: CloudMart

      - Key: Environment
        Value: !Ref Environment
  DBPasswordParameter:
    Type: AWS::SSM::Parameter

    Properties:
      Name: !Sub /cloudmart/${Environment}/db-password
      Type: SecureString
      Value: !Ref MasterUserPassword

  # ==========================================================================
  # RDS MYSQL DATABASE
  # ==========================================================================

  CloudMartDatabase:
    Type: AWS::RDS::DBInstance

    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot

    Properties:

      # -----------------------------------------------------------------------
      # Database engine
      # -----------------------------------------------------------------------

      Engine: mysql
      EngineVersion: "8.0.46"

      DBInstanceClass: !Ref DBInstanceClass

      AllocatedStorage: !Ref AllocatedStorage

      StorageType: gp3

      StorageEncrypted: true

      # -----------------------------------------------------------------------
      # Database configuration
      # -----------------------------------------------------------------------

      DBName: !Ref DatabaseName

      MasterUsername: !Ref MasterUsername

      MasterUserPassword: !Ref MasterUserPassword

      Port: 3306

      # -----------------------------------------------------------------------
      # Network configuration
      # -----------------------------------------------------------------------

      DBSubnetGroupName: !Ref CloudMartDBSubnetGroup

      VPCSecurityGroups:

      - Fn::ImportValue:
          Fn::Sub: cloudmart-${Environment}-RDSSecurityGroupId

      PubliclyAccessible: false

      # -----------------------------------------------------------------------
      # Availability
      # -----------------------------------------------------------------------

      MultiAZ: !Ref MultiAZ

      # -----------------------------------------------------------------------
      # Backup
      # -----------------------------------------------------------------------

      BackupRetentionPeriod: !Ref BackupRetentionPeriod

      CopyTagsToSnapshot: true

      # -----------------------------------------------------------------------
      # Monitoring / maintenance
      # -----------------------------------------------------------------------

      AutoMinorVersionUpgrade: true

      # -----------------------------------------------------------------------
      # Tags
      # -----------------------------------------------------------------------

      Tags:

      - Key: Name
        Value: !Sub cloudmart-${Environment}-mysql

      - Key: Project
        Value: CloudMart

      - Key: Environment
        Value: !Ref Environment

# ============================================================================
# OUTPUTS
# ============================================================================

Outputs:

  DBInstanceIdentifier:
    Description: CloudMart RDS instance identifier.
    Value: !Ref CloudMartDatabase
    Export:
      Name: !Sub cloudmart-${Environment}-rds-instance-id

  DBEndpoint:
    Description: CloudMart RDS MySQL endpoint.
    Value: !GetAtt CloudMartDatabase.Endpoint.Address
    Export:
      Name: !Sub cloudmart-${Environment}-rds-endpoint

  DBPort:
    Description: CloudMart RDS MySQL port.
    Value: !GetAtt CloudMartDatabase.Endpoint.Port
    Export:
      Name: !Sub cloudmart-${Environment}-rds-port

  DatabaseName:
    Description: CloudMart database name.
    Value: !Ref DatabaseName
    Export:
      Name: !Sub cloudmart-${Environment}-database-name

  DBMasterUsername:
    Description: CloudMart RDS master username.
    Value: !Ref MasterUsername
    Export:
      Name: !Sub cloudmart-${Environment}-db-master-username

  DBSubnetGroupName:
    Description: CloudMart RDS DB subnet group.
    Value: !Ref CloudMartDBSubnetGroup
    Export:
      Name: !Sub cloudmart-${Environment}-db-subnet-group
