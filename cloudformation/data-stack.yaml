AWSTemplateFormatVersion: '2010-09-09'

Description: 
  CloudMart Data Stack. Creates the RDS MySQL database using the private
  subnets and RDS security group created by the Network Stack.

# ============================================================================
# PARAMETERS
# ============================================================================

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment.

  LambdaCodeBucket:
    Type: String
    Description: S3 bucket containing the database initializer Lambda package.

  LambdaCodeKey:
    Type: String
    Description: S3 key containing the database initializer Lambda package.

  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    Description: RDS MySQL instance class.

  AllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    Description: RDS allocated storage in GB.

  DatabaseName:
    Type: String
    Default: cloudmart
    Description: Initial database name.

  MasterUsername:
    Type: String
    Default: admin
    Description: RDS master username.

  MasterUserPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: RDS master user password.

  MultiAZ:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Whether RDS should deploy a standby instance in another AZ.

  BackupRetentionPeriod:
    Type: Number
    Default: 7
    MinValue: 0
    Description: Number of days to retain automated backups.


# ============================================================================
# RESOURCES
# ============================================================================

Resources:

  # ==========================================================================
  # RDS DB SUBNET GROUP
  # ==========================================================================

  CloudMartDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup

    Properties:

      DBSubnetGroupDescription: >
        Private subnet group for CloudMart RDS MySQL.

      SubnetIds:

        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-PrivateSubnetAId

        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-PrivateSubnetBId

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-db-subnet-group

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================================
  # RDS MYSQL DATABASE
  # ==========================================================================

  CloudMartDatabase:
    Type: AWS::RDS::DBInstance

    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot

    Properties:

      # -----------------------------------------------------------------------
      # Database engine
      # -----------------------------------------------------------------------

      Engine: mysql
      EngineVersion: "8.0.46"

      DBInstanceClass: !Ref DBInstanceClass

      AllocatedStorage: !Ref AllocatedStorage

      StorageType: gp3

      StorageEncrypted: true


      # -----------------------------------------------------------------------
      # Database configuration
      # -----------------------------------------------------------------------

      DBName: !Ref DatabaseName

      MasterUsername: !Ref MasterUsername

      MasterUserPassword: !Ref MasterUserPassword

      Port: 3306


      # -----------------------------------------------------------------------
      # Network configuration
      # -----------------------------------------------------------------------

      DBSubnetGroupName: !Ref CloudMartDBSubnetGroup

      VPCSecurityGroups:

        - Fn::ImportValue:
            Fn::Sub: cloudmart-${Environment}-RDSSecurityGroupId

      PubliclyAccessible: false


      # -----------------------------------------------------------------------
      # Availability
      # -----------------------------------------------------------------------

      MultiAZ: !Ref MultiAZ


      # -----------------------------------------------------------------------
      # Backup
      # -----------------------------------------------------------------------

      BackupRetentionPeriod: !Ref BackupRetentionPeriod

      CopyTagsToSnapshot: true


      # -----------------------------------------------------------------------
      # Monitoring / maintenance
      # -----------------------------------------------------------------------

      AutoMinorVersionUpgrade: true


      # -----------------------------------------------------------------------
      # Tags
      # -----------------------------------------------------------------------

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-mysql

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================================
  # DATABASE INITIALIZER LAMBDA IAM ROLE
  # ==========================================================================

  DatabaseInitializerRole:
    Type: AWS::IAM::Role

    Properties:

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole


  # ==========================================================================
  # DATABASE INITIALIZER LAMBDA
  # ==========================================================================

  DatabaseInitializerLambda:
    Type: AWS::Lambda::Function

    Properties:

      Runtime: python3.12

      Handler: lambda_function.handler

      Timeout: 300

      MemorySize: 256

      Role: !GetAtt DatabaseInitializerRole.Arn

      Code:

        S3Bucket: !Ref LambdaCodeBucket

        S3Key: !Ref LambdaCodeKey

      VpcConfig:

        SubnetIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-PrivateSubnetAId

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-PrivateSubnetBId

        SecurityGroupIds:

          - Fn::ImportValue:
              Fn::Sub: cloudmart-${Environment}-RDSSecurityGroupId

      Environment:

        Variables:

          DB_HOST:
            !GetAtt CloudMartDatabase.Endpoint.Address

          DB_PORT:
            "3306"

          DB_NAME:
            !Ref DatabaseName

          DB_USERNAME:
            !Ref MasterUsername

          DB_PASSWORD:
            !Ref MasterUserPassword


  # ==========================================================================
  # DATABASE SCHEMA INITIALIZER CUSTOM RESOURCE
  # ==========================================================================

  DatabaseSchemaInitializer:
    Type: Custom::DatabaseSchemaInitializer

    DependsOn:

      - CloudMartDatabase
      - DatabaseInitializerLambda

    Properties:

      ServiceToken:
        !GetAtt DatabaseInitializerLambda.Arn


# ============================================================================
# OUTPUTS
# ============================================================================

Outputs:

  DBInstanceIdentifier:
    Description: CloudMart RDS instance identifier.
    Value: !Ref CloudMartDatabase


  DBEndpoint:
    Description: CloudMart RDS MySQL endpoint.
    Value: !GetAtt CloudMartDatabase.Endpoint.Address


  DBPort:
    Description: CloudMart RDS MySQL port.
    Value: !GetAtt CloudMartDatabase.Endpoint.Port


  DatabaseName:
    Description: CloudMart database name.
    Value: !Ref DatabaseName


  DBSubnetGroupName:
    Description: CloudMart RDS DB subnet group.
    Value: !Ref CloudMartDBSubnetGroup


  RDSSecurityGroupId:
    Description: Security group attached to the RDS instance.
    Value:
      Fn::ImportValue:
        Fn::Sub: cloudmart-${Environment}-RDSSecurityGroupId
