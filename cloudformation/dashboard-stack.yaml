AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Dashboard Stack. Creates a public EC2 instance for hosting the Flask dashboard application.

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
    - dev
    - prod

  InstanceType:
    Type: String
    Default: t3.micro

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Default: cloudmart-dashboard-key

  AmiId:
    Type: AWS::EC2::Image::Id
    Default: ami-098f18a6382fb4b2d

  LambdaCodeBucket:
    Type: String

  DashboardS3Key:
    Type: String

  GitHubRunId:
    Type: String

Resources:

  # ============================================================
  # DASHBOARD EC2 IAM ROLE
  # ============================================================

  DashboardEC2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - ec2.amazonaws.com
          Action:
          - sts:AssumeRole

      Policies:
      - PolicyName: DashboardS3Access
        PolicyDocument:
          Version: '2012-10-17'
          Statement:

          - Effect: Allow
            Action:
            - s3:GetObject
            Resource:
            - !Sub arn:aws:s3:::${LambdaCodeBucket}/dashboard/*

          - Effect: Allow
            Action:
            - s3:ListBucket
            Resource:
            - !Sub arn:aws:s3:::${LambdaCodeBucket}
      - PolicyName: DashboardSSMAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - ssm:GetParameter
            Resource:
            - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/db/*

  # ============================================================
  # DASHBOARD EC2 INSTANCE PROFILE
  # ============================================================

  DashboardInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
      - !Ref DashboardEC2Role

  # ============================================================
  # DASHBOARD EC2
  # ============================================================

  DashboardEC2:
    Type: AWS::EC2::Instance

    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPairName

      IamInstanceProfile: !Ref DashboardInstanceProfile

      SubnetId:
        Fn::ImportValue: !Sub cloudmart-${Environment}-PublicSubnetId

      SecurityGroupIds:
      - Fn::ImportValue: !Sub cloudmart-${Environment}-EC2SecurityGroupId

      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash

          set -e

          # Update system
          dnf update -y

          # Install required packages
          dnf install -y python3 python3-pip unzip

          # Create dashboard directory
          mkdir -p /opt/cloudmart-dashboard

          # Download dashboard package from S3
          cd /opt/cloudmart-dashboard

          aws s3 cp \
            s3://${LambdaCodeBucket}/${DashboardS3Key} \
            /tmp/dashboard.zip

          # Extract dashboard
          unzip -o /tmp/dashboard.zip \
            -d /opt/cloudmart-dashboard

          # Create Python virtual environment
          python3 -m venv venv

          # Activate virtual environment
          source venv/bin/activate

          # Upgrade pip
          pip install --upgrade pip

          # Install dashboard dependencies
          pip install -r requirements.txt

          # Create systemd service
          cat > /etc/systemd/system/cloudmart-dashboard.service <<'EOF'
          [Unit]
          Description=CloudMart Flask Dashboard
          After=network.target

          [Service]
          WorkingDirectory=/opt/cloudmart-dashboard
          ExecStart=/opt/cloudmart-dashboard/venv/bin/python app.py
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          EOF

          # Reload systemd
          systemctl daemon-reload

          # Enable dashboard service
          systemctl enable cloudmart-dashboard

          # Start dashboard
          systemctl start cloudmart-dashboard

      Tags:
      - Key: Name
        Value: !Sub cloudmart-${Environment}-dashboard-ec2

      - Key: Project
        Value: CloudMart

      - Key: Environment
        Value: !Ref Environment

      - Key: GitHubRunId
        Value: !Ref GitHubRunId

# ============================================================
# OUTPUTS
# ============================================================

Outputs:

  DashboardInstanceId:
    Description: Dashboard EC2 Instance ID
    Value: !Ref DashboardEC2

  DashboardPublicIp:
    Description: Dashboard EC2 Public IP
    Value: !GetAtt DashboardEC2.PublicIp

  DashboardPublicDns:
    Description: Dashboard EC2 Public DNS
    Value: !GetAtt DashboardEC2.PublicDnsName

  DashboardUrl:
    Description: CloudMart Dashboard URL
    Value: !Sub
      - http://${PublicIp}
      - PublicIp: !GetAtt DashboardEC2.PublicIp
